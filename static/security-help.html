            <li>SMS-коды, которые приходят при платежах и переводах;</li>
            <li>срок действия карты;</li>
            <li>имя и фамилию владельца;</li>
            <li>CVV/СVC — трехзначный номер на обратной стороне карты;</li>
            <li>ПИН-код.</li>
          </ul>
          <a href="mailto:911@bankffin.kz" class="w-[400px] max-w-full h-10 rounded-[20px] bg-[#00BF52] hover:bg-[#00BC58] active:bg-[#009b48] text-white font-medium text-base flex items-center justify-center my-4 transition-all">
            Написать на почту
          </a>
        `
      }
    ];

    let currentTabId = 'popular';
    let openAccordionId = 1; // 1st is open by default
    const userVotes = {}; // { [id]: 'yes' | 'no' }
    let searchQuery = '';

    // Render Tabs
    function renderTabs() {
      const tabsUl = document.getElementById('sidebar-tabs');
      tabsUl.innerHTML = '';

      tabs.forEach((tab, index) => {
        const isActive = tab.id === currentTabId;
        const isFirst = index === 0;
        const isLast = index === tabs.length - 1;

        const li = document.createElement('li');
        li.className = `w-full min-h-[56px] flex items-center justify-between px-4 py-3.5 transition-colors cursor-pointer select-none ${
          isFirst ? 'rounded-t-[20px]' : ''
        } ${isLast ? 'rounded-b-[20px]' : ''} ${
          isActive 
            ? 'bg-[rgba(126,139,153,0.12)] text-[#00BC58]' 
            : 'text-[#78878F] hover:text-[#F1F3F4] hover:bg-[rgba(126,139,153,0.06)] active:bg-[rgba(126,139,153,0.12)]'
        }`;

        // Icon
        let iconSvg = '';
        if (tab.icon === 'star') {
          iconSvg = `
            <svg class="w-6 h-6 min-w-6 ${isActive ? 'fill-[#00BC58]' : 'fill-[#78878F]'}" viewBox="0 0 23 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10.109 1.935c.505-1.252 2.277-1.252 2.782 0l1.937 4.802a.5.5 0 0 0 .423.311l4.866.397c1.32.108 1.863 1.747.869 2.622l-3.693 3.247a.5.5 0 0 0-.158.483l1.181 5.367c.295 1.341-1.217 2.34-2.335 1.545l-4.191-2.985a.5.5 0 0 0-.58 0L7.018 20.71c-1.118.796-2.63-.204-2.335-1.545l1.181-5.367a.5.5 0 0 0-.158-.483l-3.693-3.247c-.994-.875-.45-2.514.87-2.622l4.865-.397a.5.5 0 0 0 .423-.311z"></path>
            </svg>
          `;
        } else {
          iconSvg = `
            <svg class="w-6 h-6 min-w-6 ${isActive ? 'fill-[#00BC58]' : 'fill-[#78878F]'}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path clip-rule="evenodd" d="M14.691 2.11C14.228 2 13.75 2 13.114 2H9.759c-.805 0-1.47 0-2.01.044-.563.046-1.08.145-1.565.392a4 4 0 0 0-1.748 1.748c-.247.485-.346 1.002-.392 1.564C4 6.29 4 6.954 4 7.758v8.483c0 .805 0 1.47.044 2.01.046.563.145 1.08.392 1.565a4 4 0 0 0 1.748 1.748c.485.247 1.002.346 1.564.392C8.29 22 8.954 22 9.758 22h4.483c.805 0 1.47 0 2.01-.044.563-.046 1.08-.145 1.565-.392a4 4 0 0 0 1.748-1.748c.247-.485.346-1.002.392-1.564.044-.541.044-1.206.044-2.01V8.885c0-.635 0-1.114-.11-1.577a4 4 0 0 0-.48-1.156c-.248-.406-.587-.745-1.037-1.194l-1.332-1.332c-.449-.45-.788-.789-1.194-1.037a4 4 0 0 0-1.156-.48M13 4H9.8c-.857 0-1.439 0-1.889.038-.438.035-.663.1-.819.18a2 2 0 0 0-.874.874c-.08.156-.145.38-.18.82C6 6.361 6 6.942 6 7.8v8.4c0 .857 0 1.439.038 1.889.035.438.1.663.18.819a2 2 0 0 0 .874.874c.156.08.38.145.819.18C8.361 20 8.943 20 9.8 20h4.4c.857 0 1.439 0 1.889-.038.438-.035.663-.1.819-.18a2 2 0 0 0 .874-.874c.08-.156.145-.38.18-.819.037-.45.038-1.032.038-1.889V9h-2a3 3 0 0 1-3-3zm4.56 3c-.12-.142-.312-.338-.673-.699l-1.188-1.188A14 14 0 0 0 15 4.44V6a1 1 0 0 0 1 1z"></path>
            </svg>
          `;
        }

        li.innerHTML = `
          <div class="flex items-center gap-3">
            ${iconSvg}
            <span class="text-base font-medium leading-5 ${isActive ? 'text-[#00BC58]' : ''}">${tab.title}</span>
          </div>
          <svg class="w-4 h-4 min-w-4 ml-2 fill-current ${isActive ? 'text-[#00BC58]' : 'text-[#78878F]'}" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path clip-rule="evenodd" d="M5.304 13.86a.66.66 0 0 1-.293-.438.61.61 0 0 1 .143-.494L9.353 8l-4.2-4.928a.61.61 0 0 1-.142-.494.66.66 0 0 1 .293-.438.8.8 0 0 1 .267-.118.84.84 0 0 1 .578.073q.13.069.22.178l4.438 5.208c.128.149.197.331.197.519s-.07.37-.197.52l-4.439 5.207a.7.7 0 0 1-.22.178.81.81 0 0 1-.577.073.8.8 0 0 1-.267-.118"></path>
          </svg>
        `;

        li.onclick = () => {
          currentTabId = tab.id;
          document.getElementById('content-heading').textContent = tab.title;
          renderTabs();
          renderAccordions();
        };

        tabsUl.appendChild(li);
      });
    }

    // Render Accordions
    function renderAccordions() {
      const container = document.getElementById('accordions-container');
      container.innerHTML = '';

      // Filter by tab & search query
      const filtered = accordionsData.filter(item => {
        const matchesTab = currentTabId === 'popular' || item.tabs.includes(currentTabId);
        const matchesSearch = !searchQuery || item.title.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesTab && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-[#7E8B99]">
            По вашему запросу ничего не найдено
          </div>
        `;
        return;
      }

      filtered.forEach((item, index) => {
        const isOpen = openAccordionId === item.id;
        const isFirst = index === 0;
        const isLast = index === filtered.length - 1;

        const roundClasses = `
          ${isFirst ? 'rounded-t-[20px] rounded-b-lg' : ''}
          ${isLast ? 'rounded-b-[20px] rounded-t-lg' : ''}
          ${!isFirst && !isLast ? 'rounded-lg' : ''}
          ${filtered.length === 1 ? '!rounded-[20px]' : ''}
        `;

        const accDiv = document.createElement('div');
        accDiv.className = `bg-[rgba(126,139,153,0.08)] border transition-all ${roundClasses} ${
          isOpen ? 'border-[rgba(120,135,143,0.16)]' : 'border-transparent hover:bg-[rgba(126,139,153,0.12)]'
        }`;

        // Header button
        const headerBtn = document.createElement('button');
        headerBtn.type = 'button';
        headerBtn.className = 'w-full px-5 py-4 flex items-center justify-between text-left gap-4 cursor-pointer select-none';
        headerBtn.innerHTML = `
          <span class="text-base font-medium leading-5 text-[#F1F3F4]">${item.title}</span>
          <div class="w-6 h-6 shrink-0 flex items-center justify-center transition-transform duration-200 ${isOpen ? 'rotate-45 text-[#00BC58]' : 'text-[#7E8B99]'}">
            <svg class="w-6 h-6 stroke-current" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 19.106V4.895M4.894 12h14.211" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </div>
        `;

        headerBtn.onclick = () => {
          openAccordionId = isOpen ? null : item.id;
          renderAccordions();
        };

        accDiv.appendChild(headerBtn);

        // Body if open
        if (isOpen) {
          const bodyDiv = document.createElement('div');
          bodyDiv.className = 'px-5 pb-5 pt-1 text-base text-[#F1F3F4] border-t border-[rgba(120,135,143,0.08)]';

          const vote = userVotes[item.id];

          bodyDiv.innerHTML = `
            <div class="ck-content leading-[22px] mb-4">
              ${item.html}
            </div>

            <!-- Update Date -->
            <div class="text-xs text-[#7E8B99] mb-4">
              Обновлен: ${item.date}
            </div>

            <!-- Voting module -->
            <div class="rounded-2xl p-4 bg-[rgba(126,139,153,0.08)] border border-[rgba(120,135,143,0.12)] flex items-center justify-between">
              <div>
                <p class="text-sm font-semibold text-[#7E8B99]">Был ли ответ полезен?</p>
                ${item.stats ? `<p class="text-sm text-[#7E8B99] mt-0.5">${item.stats}</p>` : ''}
              </div>

              <!-- Buttons -->
              <div class="flex items-center gap-2">
                <button 
                  type="button" 
                  onclick="voteItem(${item.id}, 'yes')"
                  class="h-[42px] px-4 rounded-2xl border text-sm font-semibold flex items-center gap-2 transition-all cursor-pointer ${
                    vote === 'yes'
                      ? 'bg-[#00BC58]/20 border-[#00BC58] text-[#00BC58]'
                      : 'border-[rgba(120,135,143,0.16)] bg-transparent hover:bg-[#00BC58]/15 hover:border-[#00BC58] text-[#F1F3F4] active:scale-95'
                  }"
                >
                  <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path clip-rule="evenodd" d="M7.152 2.273a.5.5 0 0 1 .217-.256c.067-.042.138-.05.415-.05.2 0 .42.017.544.043.911.187 1.572.924 1.652 1.842.02.232-.043.747-.136 1.115-.055.215-.099.336-.251.69-.012.027.328.034 1.648.034 1.087 0 1.73.01 1.858.03.783.121 1.359.64 1.524 1.375.025.108.044.275.044.37 0 .274-.777 5.177-.854 5.389a1.6 1.6 0 0 1-.44.664 1.9 1.9 0 0 1-.73.44 1.3 1.3 0 0 1-.392.064l-2.517.007c-2.529.007-2.867.015-3.154-.103-.06-.025-.119-.056-.195-.093a4 4 0 0 1-.505-.313l-.265-.196V6.357l.165-.106c.505-.325.951-.908 1.166-1.522.143-.41.164-.612.164-1.53 0-.682.008-.844.042-.926M2.334 6.309a1 1 0 0 0-1 1v5.34a1 1 0 0 0 1 1h1.099a1 1 0 0 0 1-1v-5.34a1 1 0 0 0-1-1z"></path>
                  </svg>
                  <span>Да</span>
                </button>

                <button 
                  type="button" 
                  onclick="voteItem(${item.id}, 'no')"
                  class="h-[42px] px-4 rounded-2xl border text-sm font-semibold flex items-center gap-2 transition-all cursor-pointer ${
                    vote === 'no'
                      ? 'bg-red-500/20 border-red-500 text-red-400'
                      : 'border-[rgba(120,135,143,0.16)] bg-transparent hover:bg-red-500/15 hover:border-red-500 text-[#F1F3F4] active:scale-95'
                  }"
                >
                  <svg class="w-4 h-4 fill-current" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path clip-rule="evenodd" d="M8.848 13.727a.5.5 0 0 1-.217.256c-.067.042-.138.05-.415.05-.2 0-.42-.017-.544-.043a2.05 2.05 0 0 1-1.652-1.842c-.02-.232.043-.747.136-1.115-.055-.215.099-.336.251-.69.012-.027-.328-.034-1.648-.034-1.087 0-1.73-.01-1.858-.03-.783-.121-1.359-.64-1.524-1.375a2 2 0 0 1-.044-.371c0-.273.777-5.176.854-5.388a1.6 1.6 0 0 1 .44-.664c.217-.207.448-.345.73-.44q.192-.064.392-.064l2.517-.007c2.529-.007 2.867-.015 3.155.103.06.025.118.056.194.093.132.064.359.205.505.313l.265.196v6.968l-.165.106c-.505.325-.95.908-1.165 1.522-.144.41-.165.612-.165 1.53 0 .682-.008.844-.042.926m4.818-4.036a1 1 0 0 0 1-1v-5.34a1 1 0 0 0-1-1h-1.099a1 1 0 0 0-1 1v5.34a1 1 0 0 0 1 1z"></path>
                  </svg>
                  <span>Нет</span>
                </button>
              </div>
            </div>
          `;

          accDiv.appendChild(bodyDiv);
        }

        container.appendChild(accDiv);
      });
    }

    window.voteItem = function(id, val) {
      userVotes[id] = userVotes[id] === val ? null : val;
      renderAccordions();
    };

    // Live search
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderAccordions();
    });

    // Theme switcher toggle
    let isDark = true;
    const themeSwitch = document.getElementById('theme-switch');
    const switchKnob = document.getElementById('switch-knob');
    themeSwitch.onclick = () => {
      isDark = !isDark;
      if (isDark) {
        document.documentElement.classList.add('dark');
        switchKnob.style.left = '34px';
        document.body.style.backgroundColor = '#121415';
      } else {
        document.documentElement.classList.remove('dark');
        switchKnob.style.left = '2px';
        document.body.style.backgroundColor = '#F4F6F8';
      }
    };

    // Initial render
    renderTabs();
    renderAccordions();
  </script>
</body>
</html>
